<title>About me. DevOps and software engineer working on backends, automation and infrastructure. Studied for a degree in Software Engineering; based in Sri Lanka. Day to day: Azure, Terraform and CI/CD, migrations and monitoring. Also building tools that let AI agents work safely, with secrets and Telegram.</title>
